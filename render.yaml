# Render Blueprint — Backend (FastAPI)
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: agent-docx-builder-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # You'll set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12"
